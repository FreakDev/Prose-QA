<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PQA Recorder</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 12px;
        min-width: 280px;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 8px;
      }
      button {
        width: 100%;
        margin-bottom: 6px;
        padding: 6px;
        cursor: pointer;
      }
      #status {
        font-size: 12px;
        color: #444;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <label for="bridge">Bridge URL (run <code>pqa record start</code> first)</label>
    <input id="bridge" type="text" value="http://127.0.0.1:17321" />
    <button id="saveBridge">Save bridge URL</button>
    <button id="note">Add note…</button>
    <button id="checkpoint">Add checkpoint hint…</button>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
